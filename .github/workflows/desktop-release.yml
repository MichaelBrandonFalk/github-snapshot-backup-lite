name: Desktop Distributions

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to upload to
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 xvfb
      - name: Install build dependencies
        run: python -m pip install '.[build,test]' 'PySide6==6.7.3'
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build native distribution
        run: python scripts/build_desktop.py
      - name: Linux packaged GUI and CLI smoke checks
        if: runner.os == 'Linux'
        env:
          QT_DEBUG_PLUGINS: '1'
        run: |
          ldd dist/GithubSnapshot_V1.5.2/_internal/PySide6/Qt/plugins/platforms/libqxcb.so || true
          dist/GithubSnapshot_V1.5.2/GithubSnapshot_V1.5.2 --help
          xvfb-run -a dist/GithubSnapshot_V1.5.2/GithubSnapshot_V1.5.2 --smoke-test
          sudo apt-get install -y ./downloads/*.deb
          xvfb-run -a /opt/GithubSnapshot_V1.5.2/GithubSnapshot_V1.5.2 --smoke-test
      - name: Windows packaged GUI smoke check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Resolve-Path dist/GithubSnapshot_V1.5.2/GithubSnapshot_V1.5.exe
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged GUI smoke check failed: $($process.ExitCode)" }
      - name: Publish native assets and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/checksums.py
          gh release upload "$RELEASE_TAG" downloads/* --clobber
